apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup
  namespace: week-infra
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              envFrom:
                - secretRef:
                    name: week-infra-postgresql
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  STAMP=$(date +%Y-%m-%d_%H-%M-%S)
                  FILE="/backup/postgresql-${STAMP}.sql.gz"
                  echo "Dumping to ${FILE}"
                  pg_dumpall -h postgresql -U "$POSTGRES_USER" | gzip > "${FILE}"
                  echo "Dump done: $(ls -lh ${FILE})"
                  # Ротация — храним последние 7 дампов, остальное удаляем
                  cd /backup
                  ls -1t postgresql-*.sql.gz | tail -n +8 | xargs -r rm -f
                  echo "Remaining backups:"
                  ls -lh /backup
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgresql-backup
