apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup
  namespace: week-infra
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              envFrom:
                - secretRef:
                    name: postgresql-secrets
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  set -o pipefail
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  STAMP=$(date +%Y-%m-%d_%H-%M-%S)
                  FILE="/backup/postgresql-${STAMP}.sql.gz"
                  echo "Dumping to ${FILE}"
                  pg_dumpall -h postgresql -U "$POSTGRES_USER" | gzip > "${FILE}"
                  # Проверка, что дамп не пустой — иначе job должен упасть явно
                  SIZE=$(stat -c%s "${FILE}")
                  if [ "$SIZE" -lt 200 ]; then
                    echo "ERROR: dump подозрительно маленький (${SIZE} bytes) — вероятно ошибка аутентификации"
                    rm -f "${FILE}"
                    exit 1
                  fi
                  echo "Dump done: $(ls -lh ${FILE})"
                  cd /backup
                  ls -1t postgresql-*.sql.gz | tail -n +8 | xargs -r rm -f
                  echo "Remaining backups:"
                  ls -lh /backup
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgresql-backup
