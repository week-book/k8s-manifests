apiVersion: apps/v1
kind: Deployment
metadata:
  name: week-infra-placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week-infra-placeholder
  template:
    metadata:
      labels:
        app: week-infra-placeholder
    spec:
      containers:
        - name: placeholder
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          imagePullPolicy: IfNotPresent
      volumes:
        - name: html
          configMap:
            name: week-infra-placeholder-html
