apiVersion: batch/v1
kind: CronJob
metadata:
  name: garage-backup
  namespace: week-infra
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: garage-mirror
              image: minio/mc:latest
              env:
                - name: GARAGE_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: garage-secrets
                      key: GARAGE_KEY_ID
                - name: GARAGE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: garage-secrets
                      key: GARAGE_SECRET_KEY
              command:
                - sh
                - -c
                - |
                  set -e
                  mc alias set src http://garage:3900 "$GARAGE_KEY_ID" "$GARAGE_SECRET_KEY"
                  STAMP=$(date +%Y-%m-%d_%H-%M-%S)
                  mkdir -p /backup/mirror
                  for BUCKET in posts week-art; do
                    mc mirror --overwrite "src/${BUCKET}" "/backup/mirror/${BUCKET}"
                  done
                  tar -czf "/backup/minio-${STAMP}.tar.gz" -C /backup/mirror .
                  rm -rf /backup/mirror
                  echo "Snapshot done: $(ls -lh /backup/minio-${STAMP}.tar.gz)"
                  cd /backup
                  ls -1t minio-*.tar.gz | tail -n +8 | xargs -r rm -f
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: garage-backup
