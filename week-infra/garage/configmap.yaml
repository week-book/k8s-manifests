apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: week-infra
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    # Single-node deployment — без репликации, как и было с MinIO (один диск, одна нода)
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret_file = "/secrets/rpc_secret"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.week-infra.ru"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/secrets/admin_token"
