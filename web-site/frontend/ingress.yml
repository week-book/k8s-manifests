apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-site-frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/forwarded-for-header: "CF-Connecting-IP"
    nginx.ingress.kubernetes.io/whitelist-source-range: >-
      173.245.48.0/20,
      103.21.244.0/22,
      103.22.200.0/22,
      103.31.4.0/22,
      141.101.64.0/18,
      108.162.192.0/18,
      190.93.240.0/20,
      188.114.96.0/20,
      197.234.240.0/22,
      198.41.128.0/17,
      162.158.0.0/15,
      104.16.0.0/13,
      104.24.0.0/14,
      172.64.0.0/13,
      131.0.72.0/22,
      2400:cb00::/32,
      2606:4700::/32,
      2803:f800::/32,
      2405:b500::/32,
      2405:8100::/32,
      2a06:98c0::/29,
      2c0f:f248::/32
spec:
  ingressClassName: nginx
  rules:
    - host: week-book.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-site-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - week-book.ru
      secretName: week-book-tls

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-site-frontend-redirect
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://week-book.ru$request_uri"
    nginx.ingress.kubernetes.io/permanent-redirect-code: "301"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/forwarded-for-header: "CF-Connecting-IP"
spec:
  ingressClassName: nginx
  rules:
    - host: web-site.week-book.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-site-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - web-site.week-book.ru
      secretName: web-site-frontend-tls
