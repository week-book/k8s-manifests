apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-site-frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    - host: web-site.week-book.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-site-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - web-site.week-book.ru
      secretName: web-site-frontend-tls
