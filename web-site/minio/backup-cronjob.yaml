apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  namespace: web-site
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: minio-mirror
              image: minio/mc:latest
              envFrom:
                - secretRef:
                    name: minio-secrets
              command:
                - sh
                - -c
                - |
                  set -e
                  mc alias set src http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                  STAMP=$(date +%Y-%m-%d_%H-%M-%S)
                  DEST="/backup/minio-${STAMP}"
                  mkdir -p "$DEST"
                  mc mirror --overwrite src "$DEST"
                  echo "Snapshot done: $(du -sh $DEST)"
                  cd /backup
                  ls -1dt minio-*/ | tail -n +8 | xargs -r rm -rf
                  echo "Remaining backups:"
                  ls -lh /backup
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: minio-backup
