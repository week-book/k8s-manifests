apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  namespace: web-site
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: minio-mirror
              image: minio/mc:latest
              envFrom:
                - secretRef:
                    name: minio-secrets
              command:
                - sh
                - -c
                - |
                  set -e
                  mc alias set src http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                  STAMP=$(date +%Y-%m-%d_%H-%M-%S)
                  mkdir -p /backup/mirror
                  for BUCKET in posts week-art; do
                    mc mirror --overwrite "src/${BUCKET}" "/backup/mirror/${BUCKET}"
                  done
                  tar -czf "/backup/minio-${STAMP}.tar.gz" -C /backup/mirror .
                  rm -rf /backup/mirror
                  echo "Snapshot done: $(ls -lh /backup/minio-${STAMP}.tar.gz)"
                  cd /backup
                  ls -1t minio-*.tar.gz | tail -n +8 | xargs -r rm -f
             volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: minio-backup
