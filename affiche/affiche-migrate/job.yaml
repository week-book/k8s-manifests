apiVersion: batch/v1
kind: Job
metadata:
  name: affiche-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: ghcr.io/week-book/affiche-api
        command:
          - sh
          - -c
          - |
            migrate \
              -path /migrations \
              -database "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}?sslmode=disable" \
              up
        envFrom:
          - secretRef:
              name: affiche-api-secrets
      restartPolicy: Never
  backoffLimit: 0
