apiVersion: batch/v1
kind: Job
metadata:
  name: affiche-migrate
  annotations:
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    run-id: "2026-01-10-1"
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: ghcr.io/week-book/affiche-api
        command:
          - sh
          - -c
          - |
            migrate \
              -path /migrations \
              -database "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}?sslmode=disable" \
              up
        envFrom:
          - secretRef:
              name: affiche-migrate-secrets
        env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: affiche-db-secrets
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: affiche-db-secrets
                key: POSTGRES_PASSWORD
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: affiche-db-secrets
                key: POSTGRES_DB
          - name: DB_HOST
            value: affiche-db
      restartPolicy: Never
  backoffLimit: 3
