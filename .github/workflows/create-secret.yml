name: Seal secrets

on:
  workflow_dispatch:
    inputs:
      bot:
        description: "Name bots (artic-bot)"
        required: true

jobs:
  seal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Install kubeseal
        run: |
          set -e
          VERSION=0.26.0
          curl -L \
            https://github.com/bitnami-labs/sealed-secrets/releases/download/v${VERSION}/kubeseal-${VERSION}-linux-amd64.tar.gz \
            | tar xz
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal

      - name: Create .env file
        env:
          BOT: ${{ inputs.bot }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          set -euo pipefail

          BOT_UPPER=$(echo "$BOT" | tr '[:lower:]-' '[:upper:]_')
          SECRET_NAME="${BOT_UPPER}_ENV"

          ENV_CONTENT=$(echo "$SECRETS_JSON" | jq -r --arg key "$SECRET_NAME" '.[$key]')

          if [ -z "$ENV_CONTENT" ] || [ "$ENV_CONTENT" = "null" ]; then
            echo "❌ GitHub Secret $SECRET_NAME not found or empty"
            exit 1
          fi

          mkdir -p "$BOT/secrets"
          echo "$ENV_CONTENT" > "$BOT/secrets/$BOT.env"

          echo "✅ Create $BOT/secrets/$BOT.env"

      - name: Seal secrets
        env:
          BOT: ${{ inputs.bot }}
        run: |
          make seal
