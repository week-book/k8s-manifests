apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-site
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/week-book/k8s-manifests.git
    targetRevision: main
    path: web-site
  destination:
    server: https://kubernetes.default.svc
    namespace: web-site
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
