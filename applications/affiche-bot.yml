apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: affiche-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/week-book/k8s-manifests.git
    targetRevision: main
    path: affiche/affiche-bot
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
